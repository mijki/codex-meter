name: Feature request
description: Propose a local-first Codex Meter improvement.
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: dropdown
    id: accuracy
    attributes:
      label: Expected accuracy class
      options: [reported_exact, derived_exact, estimated, unavailable, not applicable]
  - type: textarea
    id: proposal
    attributes:
      label: Proposed local-only behavior
