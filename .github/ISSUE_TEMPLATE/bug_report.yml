name: Bug report
description: Report reproducible Codex Meter behavior without sensitive data.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include tokens, prompts, responses, repository contents, or unredacted diagnostics.
  - type: input
    id: version
    attributes:
      label: Codex Meter version
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex CLI version
  - type: textarea
    id: observed
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction using synthetic data
